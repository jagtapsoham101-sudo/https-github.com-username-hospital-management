<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hospital Management</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.top{background:#142b4a;color:white;padding:22px max(5vw,20px)}.top h1{margin:0;font-size:23px}.top p{margin:5px 0 0;color:#c8d7e9}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.nav{display:flex;gap:12px;margin-bottom:20px}.nav a,.btn{background:#1769aa;color:white;padding:10px 14px;border-radius:8px;text-decoration:none;border:0;display:inline-block}.card{background:white;border:1px solid #e1e8f0;border-radius:12px;padding:18px;box-shadow:0 3px 14px #17203308}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.muted{color:#66758a}.count{font-size:27px;font-weight:700;margin-top:8px}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:11px;border-bottom:1px solid #e8edf3;vertical-align:top}th{background:#f0f4f8}.tablewrap{overflow:auto;border-radius:10px}.flash{padding:12px;margin:10px 0;border-radius:8px;background:#e8f5ec}.error{background:#ffeded}input{width:100%;padding:10px;border:1px solid #ccd6e2;border-radius:7px;margin:6px 0 14px}label{font-weight:600}h2{margin-top:0}.actions{display:flex;gap:10px;align-items:center;margin:16px 0}.actions a{color:#1769aa}@media(max-width:600px){th,td{padding:8px;font-size:13px}}
</style></head><body><header class="top"><h1>Hospital Management System</h1><p>Connected to your existing MySQL database</p></header><main class="wrap"><nav class="nav"><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('health') }}">Database health</a></nav>
{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{ 'error' if category=='error' else '' }}">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}</main></body></html>
